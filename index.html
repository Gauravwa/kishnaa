<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400&family=Rozha+One&display=swap" rel="stylesheet">
</head>
<body>
    <script type="module" src="https://cdn.jsdelivr.net/npm/hic-pageflip/index.js"></script>

    <hic-pageflip engine="3d" page-width="300" page-height="450" page-background="#c1c8c7">
        <!-- Slide 1: Cover -->
        <hic-pageflip-page>
            <div class="content">
               
                <header>
                    <h1>ŚRĪ KṚṢṆA</h1>
                    <p class="subheading">The Descent of the Supreme Puruṣa</p>
                </header>
            </div>
        </hic-pageflip-page>

        <!-- Slide 2 -->
        <hic-pageflip-page>
            <div class="content">
                <div class="sanskrit" lang="sa">
                    यदा यदा हि धर्मस्य ग्लानिर्भवति भारत ।<br>
                    अभ्युत्थानमधर्मस्य तदात्मानं सृजाम्यहम् ॥<br><br>
                    परित्राणाय साधूनां विनाशाय च दुष्कृताम् ।<br>
                    धर्मसंस्थापनार्थाय सम्भवामि युगे युगे ॥
                </div>
            </div>
        </hic-pageflip-page>

        <!-- Slide 3 -->
        <hic-pageflip-page>
            <div class="content">
                </div>
        </hic-pageflip-page>

        <!-- Slide 4: Backcover -->
        <hic-pageflip-page>
            <div class="content">
                </div>
        </hic-pageflip-page>
    </hic-pageflip>


    <script src="./script.js"></script>
</body>
</html>
